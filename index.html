<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sistem Perpustakaan FINAL PRO MAX</title>

<style>
:root{
--primary:#0ea5e9;
--success:#22c55e;
--danger:#ef4444;
--warning:#f59e0b;
--neutral:#64748b;
}

body{
margin:0;
font-family:Segoe UI;
background:url('https://images.unsplash.com/photo-1524995997946-a1c2e315a42f') center/cover no-repeat fixed;
color:#fff;
}

.login{display:flex;justify-content:center;align-items:center;height:100vh}
.login-box{background:rgba(0,0,0,.85);padding:30px;border-radius:15px;width:320px}

.wrapper{max-width:1200px;margin:auto;padding:15px}
.glass{background:rgba(0,0,0,.7);padding:20px;border-radius:15px}

.sidebar{position:fixed;left:-260px;top:0;width:260px;height:100%;background:#000;transition:.4s;padding-top:60px;}
.sidebar.show{left:0}
.sidebar a{display:block;padding:15px;color:#fff;text-decoration:none}
.sidebar a:hover{background:var(--primary)}

.menu-btn{font-size:24px;cursor:pointer}

.overlay{position:fixed;width:100%;height:100%;background:rgba(0,0,0,.6);backdrop-filter:blur(5px);opacity:0;visibility:hidden;transition:.3s;}
.overlay.show{opacity:1;visibility:visible}

.modal{
position:fixed;top:50%;left:50%;
transform:translate(-50%,-50%) scale(.7);
background:linear-gradient(135deg,#22c55e,#15803d);
padding:25px;border-radius:15px;
opacity:0;visibility:hidden;transition:.3s;
width:90%;max-width:420px;text-align:center;
}
.modal.show{opacity:1;visibility:visible;transform:translate(-50%,-50%) scale(1)}

img.preview{width:120px;height:120px;object-fit:cover;border-radius:10px;margin-bottom:10px;border:3px solid #fff;}

.logo{text-align:center}
.logo img{width:90px;border-radius:50%;background:#fff;padding:5px}
.welcome{text-align:center;font-size:26px;font-weight:bold;color:#38bdf8;margin-bottom:10px}

.clock{text-align:center;font-size:40px}
.date{text-align:center}

.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.card{padding:15px;border-radius:10px;text-align:center;font-weight:bold}
.total{background:#0ea5e9}
.active{background:#22c55e}
.expired{background:#ef4444}

@keyframes blink{0%{opacity:1}50%{opacity:.3}100%{opacity:1}}
.status-active{color:#22c55e;font-weight:bold;animation:blink 1s infinite}
.status-expired{color:#ef4444;font-weight:bold;animation:blink 1s infinite}

button{padding:8px 14px;border:none;border-radius:8px;color:#fff;cursor:pointer}
.btn-primary{background:#0ea5e9}
.btn-success{background:#22c55e}
.btn-warning{background:#f59e0b}
.btn-danger{background:#ef4444}
.btn-neutral{background:#64748b}
.btn-view{background:#0ea5e9}
.btn-edit{background:#f59e0b}
.btn-delete{background:#ef4444}
.btn-renew{background:#22c55e}

.logout{position:fixed;top:10px;right:10px;background:#ef4444;padding:8px;border-radius:10px;}

.page{display:none}
.page.show{display:block}

input,select{padding:10px;border-radius:8px;border:none;width:100%;margin-bottom:10px}

table{width:100%;border-collapse:collapse;font-size:12px}
th,td{padding:6px;text-align:center}
th{background:#0ea5e9}
img.thumb{width:40px;height:40px;border-radius:50%}

</style>
</head>

<body>

<!-- LOGIN -->
<div id="loginPage" class="login">
<div class="login-box">
<h2>Login Sistem</h2>
<input id="user" placeholder="Username">
<input id="pass" type="password" placeholder="Password">
<button class="btn-primary" onclick="login()">Login</button>
</div>
</div>

<div id="main" style="display:none">

<button class="logout" onclick="logout()">Log Off</button>

<div id="overlay" class="overlay"></div>
<div id="modal" class="modal"></div>

<div id="sidebar" class="sidebar">
<a id="menuDashboard" onclick="openPage('dashboard')">Dashboard</a>
<a id="menuDaftar" onclick="openPage('daftar')">Daftar Ahli</a>
<a onclick="openPage('senarai')">Senarai Ahli</a>
</div>

<div class="wrapper">
<div class="glass">

<span class="menu-btn" onclick="toggleMenu()">☰</span>

<!-- DASHBOARD -->
<div id="dashboard" class="page show">
<div class="logo">
<img src="logo_mds.png">
</div>
<div class="welcome">
Selamat Datang<br>Ke<br>Perpustakaan Awam<br>Majlis Daerah Simunjan
</div>
<div class="clock" id="clock"></div>
<div class="date" id="date"></div>
<div class="stats">
<div class="card total">Jumlah<br><span id="total"></span></div>
<div class="card active">Aktif<br><span id="aktif"></span></div>
<div class="card expired">Tamat<br><span id="tamat"></span></div>
</div>
</div>

<!-- DAFTAR -->
<div id="daftar" class="page">
<h2>Daftar Ahli</h2>
<form id="form">
<input id="nama" placeholder="Nama">
<input id="ic" placeholder="IC">
<input id="jantina" readonly placeholder="Jantina auto">
<input id="phone" placeholder="Telefon">
<input id="alamat" placeholder="Alamat">
<input id="poskod" placeholder="Poskod">
<input id="bandar" placeholder="Bandar">
<select id="negeri">
<option value="">Pilih Negeri</option>
<option>Sarawak</option><option>Sabah</option><option>Johor</option>
</select>
<input type="file" id="gambar">
<button type="submit" class="btn-success">Daftar</button>
</form>
</div>

<!-- SENARAI -->
<div id="senarai" class="page">
<h2>Senarai Ahli</h2>
<input id="search" placeholder="Cari..." oninput="render()">
<table id="table"></table>
</div>

</div>
</div>
</div>

<script>

/* LOGIN & ROLE */
let role = localStorage.getItem('role')

if(localStorage.getItem('login')){
loginPage.style.display='none'
main.style.display='block'
applyRole()
}

function login(){
if(user.value==='admin'&&pass.value==='123'){
localStorage.setItem('login',true)
localStorage.setItem('role','admin')
location.reload()
}else if(user.value==='user'&&pass.value==='123'){
localStorage.setItem('login',true)
localStorage.setItem('role','user')
location.reload()
}else alert("Login gagal")
}

function logout(){localStorage.clear();location.reload()}

function applyRole(){
if(role==='user'){
menuDaftar.style.display='none'
}
}

/* MENU */
function toggleMenu(){sidebar.classList.toggle('show');overlay.classList.toggle('show')}
function openPage(p){
document.querySelectorAll('.page').forEach(x=>x.classList.remove('show'))
document.getElementById(p).classList.add('show')
toggleMenu()
}
overlay.onclick=closeModal

/* CLOCK */
setInterval(()=>{
let d=new Date()
clock.innerText=d.toLocaleTimeString()
date.innerText=d.toDateString()
},1000)

function formatTarikh(t){return new Date(t).toLocaleDateString('ms-MY')}

/* IC */
ic.oninput=function(){
let n=this.value.replace(/\D/g,'').slice(0,12)
this.value=n.replace(/(\d{6})(\d{2})(\d{4})/,'$1-$2-$3')
jantina.value = n.length===12?(parseInt(n.slice(-1))%2?'Lelaki':'Perempuan'):''
}

/* IMAGE */
let imgData=""
gambar.onchange=e=>{
let r=new FileReader()
r.onload=()=>imgData=r.result
r.readAsDataURL(e.target.files[0])
}

/* DATA */
let data=JSON.parse(localStorage.getItem('ahli')||'[]')

function generateID(){
let y=new Date().getFullYear()
let c=localStorage.getItem("c"+y)||0
c++;localStorage.setItem("c"+y,c)
return "MDSPA"+y+"-"+String(c).padStart(4,'0')
}

/* SUBMIT */
form.onsubmit=e=>{
e.preventDefault()

let now=new Date()
let exp=new Date();exp.setFullYear(exp.getFullYear()+1)

let ahli={
id:generateID(),
nama:nama.value,
ic:ic.value,
jantina:jantina.value,
phone:phone.value,
alamat:alamat.value,
poskod:poskod.value,
bandar:bandar.value,
negeri:negeri.value,
gambar:imgData,
tarikhDaftar:now.toISOString(),
luput:exp.toISOString()
}

data.push(ahli)
localStorage.setItem('ahli',JSON.stringify(data))
form.reset();imgData=""

showModal(`
<h3>Pendaftaran Berjaya</h3>
${ahli.gambar?`<img src="${ahli.gambar}" class="preview">`:''}
<p>${ahli.id}</p>
<p>${ahli.nama}</p>
<p>${formatTarikh(ahli.tarikhDaftar)}</p>
`)

render();updateStat()
}

/* STATUS */
function status(l){return new Date(l)>new Date()?'ACTIVE':'EXPIRED'}

/* 🔥 TABLE FULL DETAIL UNTUK SEMUA */
function render(){
table.innerHTML=`<tr>
<th>ID</th><th>Gambar</th><th>Nama</th><th>IC</th>
<th>Jantina</th><th>Telefon</th>
<th>Tarikh Daftar</th><th>Tarikh Luput</th>
<th>Status</th><th>Alamat</th><th>Tindakan</th></tr>`

data.forEach((d,i)=>{
let st=status(d.luput)

table.innerHTML+=`
<tr>
<td>${d.id}</td>
<td>${d.gambar?`<img src="${d.gambar}" class="thumb">`:'-'}</td>
<td>${d.nama}</td>
<td>${d.ic}</td>
<td>${d.jantina}</td>
<td>${d.phone}</td>
<td>${formatTarikh(d.tarikhDaftar)}</td>
<td>${formatTarikh(d.luput)}</td>
<td class="${st=='ACTIVE'?'status-active':'status-expired'}">${st}</td>
<td>${d.alamat}, ${d.poskod}, ${d.bandar}, ${d.negeri}</td>
<td>
<button class="btn-view" onclick="viewData(${i})">View</button>
${role==='admin'?`
<button class="btn-edit" onclick="editData(${i})">Edit</button>
<button class="btn-renew" onclick="renew(${i})">Renewal</button>
<button class="btn-delete" onclick="del(${i})">Delete</button>`:''}
</td>
</tr>`
})
}

/* FUNCTION LAIN KEKAL */
function viewData(i){
let d=data[i]
showModal(`<h3>${d.nama}</h3>`)
}

function editData(i){
let d=data[i]
modal.className="modal show"
modal.innerHTML=`<input id="eNama" value="${d.nama}">
<button onclick="saveEdit(${i})">Simpan</button>`
overlay.classList.add('show')
}

function saveEdit(i){
data[i].nama=eNama.value
localStorage.setItem('ahli',JSON.stringify(data))
closeModal();render()
}

function renew(i){
let exp=new Date()
exp.setFullYear(exp.getFullYear()+1)
data[i].luput=exp.toISOString()
localStorage.setItem('ahli',JSON.stringify(data))
showModal("Renew berjaya")
render();updateStat()
}

function del(i){
data.splice(i,1)
localStorage.setItem('ahli',JSON.stringify(data))
render();updateStat()
}

function showModal(msg){
modal.classList.add('show')
modal.innerHTML=msg+`<br><br><button onclick="closeModal()">OK</button>`
overlay.classList.add('show')
}

function closeModal(){
modal.classList.remove('show')
overlay.classList.remove('show')
}

function updateStat(){
total.innerText=data.length
aktif.innerText=data.filter(d=>status(d.luput)=='ACTIVE').length
tamat.innerText=data.filter(d=>status(d.luput)=='EXPIRED').length
}

render();updateStat()

</script>

</body>
</html>
