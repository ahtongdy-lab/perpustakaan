<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sistem Perpustakaan</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>
*{box-sizing:border-box}
body{
margin:0;
font-family:'Poppins',sans-serif;
background:linear-gradient(rgba(0,0,50,0.7),rgba(0,0,80,0.8)),
url('https://images.unsplash.com/photo-1524995997946-a1c2e315a42f') center/cover no-repeat;
}

/* HEADER */
.header{
position:fixed;
top:0;width:100%;
background:rgba(0,0,0,0.7);
color:white;
padding:10px;
display:flex;
justify-content:center;
align-items:center;
gap:10px;
z-index:1000;
}
.header img{width:45px}

/* SIDEBAR */
.sidebar{
width:220px;
background:rgba(0,0,0,0.65);
position:fixed;
top:70px;
bottom:0;
padding:10px;
display:none;
}
.sidebar button{
width:100%;
margin:6px 0;
padding:12px;
border:none;
border-radius:12px;
background:rgba(255,255,255,0.1);
color:white;
}

/* MAIN */
.main{
margin-left:230px;
margin-top:80px;
padding:20px;
display:flex;
justify-content:center;
}

/* CONTAINER */
.container{
width:100%;
max-width:1100px;
background:rgba(255,255,255,0.12);
padding:25px;
border-radius:20px;
color:white;
text-align:center;
}

/* INPUT */
input{
width:100%;
padding:10px;
margin:6px 0;
border-radius:10px;
border:none;
}

/* BUTTON */
button{
padding:8px 12px;
border:none;
border-radius:8px;
cursor:pointer;
}
.main-btn{
width:100%;
margin-top:8px;
background:#003366;
color:white;
}

/* TABLE */
.table-wrap{overflow-x:auto}
table{width:100%;margin-top:10px;border-collapse:collapse;min-width:1000px}
th,td{padding:10px;border-bottom:1px solid rgba(255,255,255,0.2)}

/* IMAGE */
.avatar{width:55px;height:55px;border-radius:50%;object-fit:cover}

/* STATUS */
.status-active{color:#00ff88;font-weight:bold}
.status-expired{color:#ff4d4d;font-weight:bold}

/* DASHBOARD */
.welcome{font-size:20px;margin-bottom:10px}
#clock{font-size:34px;font-weight:bold}
#dateBox{font-size:20px;margin-bottom:10px}

/* STATS */
.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:15px}
.stat-card{padding:20px;border-radius:15px;font-weight:bold}
.stat-blue{background:#0066cc}
.stat-green{background:#00aa66}
.stat-red{background:#cc0033}

/* MOBILE */
@media(max-width:768px){
.main{margin-left:0}
.sidebar{width:100%}
}
</style>
</head>

<body>

<div class="header">
<img src="logo_mds.png">
<div>Perpustakaan Awam Majlis Daerah Simunjan</div>
</div>

<div class="sidebar" id="sidebar">
<button onclick="showPage('menuPage')">Dashboard</button>
<button onclick="showPage('daftarPage')" id="btnAdmin">Daftar Ahli</button>
<button onclick="showPage('semakPage')">Semakan Ahli</button>
<button onclick="logout()">Log Keluar</button>
</div>

<div class="main">

<!-- LOGIN -->
<div class="container" id="loginPage">
<h2>Log Masuk Sistem</h2>
<input id="user" placeholder="Username">
<input id="pass" type="password" placeholder="Password">
<button class="main-btn" onclick="login()">Log Masuk</button>
</div>

<!-- DASHBOARD -->
<div class="container" id="menuPage" style="display:none">
<div class="welcome">Selamat Datang Ke Perpustakaan Awam Majlis Daerah Simunjan</div>

<div id="clock"></div>
<div id="dateBox"></div>

<div id="stats"></div>
</div>

<!-- DAFTAR -->
<div class="container" id="daftarPage" style="display:none">
<h2>Daftar Ahli</h2>

<input id="nama" placeholder="Nama">
<input id="ic" placeholder="000000-00-0000">
<input id="jantina" readonly placeholder="Jantina">
<input id="telefon" placeholder="012-3456789">
<input id="alamat" placeholder="Alamat">
<input type="file" id="gambar">

<button class="main-btn" onclick="daftarAhli()">Daftar</button>

<div class="table-wrap">
<table id="tableAhli"></table>
</div>
</div>

<!-- SEMAK -->
<div class="container" id="semakPage" style="display:none">
<h2>Semakan Ahli</h2>
<input id="semakIC">
<button class="main-btn" onclick="semakAhli()">Semak</button>

<div class="table-wrap">
<table id="tableSemak"></table>
</div>
</div>

</div>

<script>
let ahliList=JSON.parse(localStorage.getItem('ahliList'))||[];
let role="user";

/* LOGIN */
function login(){
if(user.value==="admin"&&pass.value==="1234"){
role="admin";btnAdmin.style.display='block';
}else{
role="user";btnAdmin.style.display='none';
}
sidebar.style.display='block';
showPage('menuPage');
}

/* LOGOUT */
function logout(){
sidebar.style.display='none';
showPage('loginPage');
}

/* PAGE */
function showPage(p){
document.querySelectorAll('.container').forEach(x=>x.style.display='none');
document.getElementById(p).style.display='block';
if(p==='daftarPage')loadTable();
if(p==='menuPage')loadStats();
}

/* IC FORMAT */
ic.addEventListener('input',function(){
let v=this.value.replace(/\D/g,'').substring(0,12);
if(v.length>6)v=v.slice(0,6)+'-'+v.slice(6);
if(v.length>9)v=v.slice(0,9)+'-'+v.slice(9);
this.value=v;
jantina.value=v.slice(-1)%2===0?'Perempuan':'Lelaki';
});

/* TELEFON */
telefon.addEventListener('input',function(){
let v=this.value.replace(/\D/g,'').substring(0,11);
if(v.length>3)v=v.slice(0,3)+'-'+v.slice(3);
this.value=v;
});

/* DATE */
function formatDate(d){return d.toISOString().split('T')[0];}

/* DAFTAR */
function daftarAhli(){
if(role!=="admin")return;

let reader=new FileReader();
let file=gambar.files[0];

reader.onload=function(){
let today=new Date();
let exp=new Date();exp.setFullYear(exp.getFullYear()+1);

ahliList.push({
nama:nama.value,
ic:ic.value,
jantina:jantina.value,
telefon:telefon.value,
alamat:alamat.value,
gambar:reader.result,
tarikhDaftar:formatDate(today),
tarikhLuput:formatDate(exp)
});

localStorage.setItem('ahliList',JSON.stringify(ahliList));
loadTable();loadStats();
};

if(file)reader.readAsDataURL(file);
}

/* STATUS */
function getStatus(l){
return formatDate(new Date())>l?'expired':'active';
}

/* TABLE DAFTAR */
function loadTable(){
if(role!=="admin")return;

tableAhli.innerHTML=`<tr>
<th>Gambar</th><th>Nama</th><th>IC</th><th>Jantina</th>
<th>Telefon</th><th>Alamat</th>
<th>Daftar</th><th>Luput</th><th>Status</th>
</tr>`;

ahliList.forEach(a=>{
let s=getStatus(a.tarikhLuput);

tableAhli.innerHTML+=`
<tr>
<td><img src="${a.gambar||''}" class="avatar"></td>
<td>${a.nama}</td>
<td>${a.ic}</td>
<td>${a.jantina}</td>
<td>${a.telefon}</td>
<td>${a.alamat}</td>
<td>${a.tarikhDaftar}</td>
<td>${a.tarikhLuput}</td>
<td class="${s==='active'?'status-active':'status-expired'}">${s==='active'?'AKTIF':'LUPUT'}</td>
</tr>`;
});
}

/* SEMAK */
function semakAhli(){
let r=ahliList.find(a=>a.ic===semakIC.value);
if(!r){tableSemak.innerHTML="Tiada rekod";return;}

let s=getStatus(r.tarikhLuput);

tableSemak.innerHTML=`<tr>
<th>Gambar</th><th>Nama</th><th>IC</th><th>Jantina</th>
<th>Telefon</th><th>Alamat</th>
<th>Daftar</th><th>Luput</th><th>Status</th>
</tr>
<tr>
<td><img src="${r.gambar||''}" class="avatar"></td>
<td>${r.nama}</td>
<td>${r.ic}</td>
<td>${r.jantina}</td>
<td>${r.telefon}</td>
<td>${r.alamat}</td>
<td>${r.tarikhDaftar}</td>
<td>${r.tarikhLuput}</td>
<td class="${s==='active'?'status-active':'status-expired'}">${s==='active'?'AKTIF':'LUPUT'}</td>
</tr>`;
}

/* DASHBOARD */
function loadStats(){
let total=ahliList.length;
let aktif=ahliList.filter(a=>getStatus(a.tarikhLuput)==='active').length;
let luput=total-aktif;

stats.innerHTML=`
<div class="stats-grid">
<div class="stat-card stat-blue">Jumlah ${total}</div>
<div class="stat-card stat-green">Aktif ${aktif}</div>
<div class="stat-card stat-red">Luput ${luput}</div>
</div>`;
}

/* CLOCK + DATE */
setInterval(()=>{
let now=new Date();
clock.innerText=now.toLocaleTimeString();

let hari=now.toLocaleDateString('ms-MY',{weekday:'long'});
let tarikh=now.toLocaleDateString('ms-MY');
dateBox.innerText=hari.toUpperCase()+" | "+tarikh;
},1000);
</script>

</body>
</html>
