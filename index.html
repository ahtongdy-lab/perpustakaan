<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Sistem Perpustakaan MDS</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>
*{box-sizing:border-box}
body{
margin:0;
font-family:'Poppins',sans-serif;
background:linear-gradient(rgba(0,0,50,0.6),rgba(0,0,80,0.7)),
url('https://images.unsplash.com/photo-1524995997946-a1c2e315a42f') center/cover no-repeat;
}

/* HEADER */
.header{
position:fixed;
top:0;width:100%;
background:rgba(0,0,0,0.8);
color:white;
padding:10px;
display:flex;
align-items:center;
gap:10px;
justify-content:center;
z-index:1000;
}
.header img{width:45px}

/* MENU */
.menu-toggle{
position:fixed;
top:70px;left:10px;
background:#003366;color:white;
padding:12px;border-radius:10px;
cursor:pointer;
display:none;
}

.sidebar{
position:fixed;
top:120px;
left:0;
width:240px;
background:rgba(0,0,0,0.8);
padding:10px;
display:none;
}

.sidebar button{
width:100%;
padding:15px;
margin:6px 0;
border:none;
border-radius:12px;
background:rgba(255,255,255,0.1);
color:white;
font-size:15px;
}

/* MAIN */
.wrapper{margin-top:90px}
.container{
max-width:1100px;
margin:auto;
margin-top:20px;
padding:20px;
color:white;
border-radius:20px;
background:rgba(255,255,255,0.15);
backdrop-filter:blur(12px);
}

/* DASHBOARD */
.dashboard{
text-align:center;
}
.big-clock{
font-size:42px;
font-weight:bold;
margin:10px 0;
}

.stats{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
gap:15px;
margin-top:20px;
}

.stat{
padding:20px;
border-radius:15px;
font-weight:bold;
}

.blue{background:#0066cc}
.green{background:#00aa66}
.red{background:#cc0033}

/* TABLE */
table{width:100%;margin-top:10px;border-collapse:collapse}
th,td{padding:8px;text-align:center;border-bottom:1px solid rgba(255,255,255,0.2)}

.status-active{color:#00ff88;font-weight:bold}
.status-expired{color:#ff4d4d;font-weight:bold}

.avatar{width:50px;height:50px;border-radius:50%}

/* INPUT */
input{
width:100%;
padding:10px;
margin:5px 0;
border-radius:10px;
border:none;
}

button{
width:100%;
padding:10px;
margin-top:5px;
border:none;
border-radius:10px;
background:#003366;
color:white;
cursor:pointer;
}

.back{background:#555}

</style>
</head>

<body>

<div class="header">
<img src="logo_mds.png">
<div>Sistem Perpustakaan Awam Majlis Daerah Simunjan</div>
</div>

<div class="menu-toggle" id="menuBtn" onclick="toggleMenu()">☰ MENU</div>
<div class="sidebar" id="sidebar"></div>

<div class="wrapper">

<!-- LOGIN -->
<div class="container" id="loginPage">
<h2>Log Masuk Sistem Perpustakaan</h2>
<input id="user" placeholder="Masukkan Username">
<input id="pass" type="password" placeholder="Masukkan Password">
<button onclick="login()">Login</button>
</div>

<!-- DASHBOARD -->
<div class="container dashboard" id="menuPage" style="display:none">
<h2>Selamat Datang ke Perpustakaan Awam MDS</h2>

<div class="big-clock" id="clock"></div>
<div id="date"></div>

<div class="stats" id="stats"></div>
</div>

<!-- DAFTAR -->
<div class="container" id="daftarPage" style="display:none">
<h2>Daftar Ahli</h2>

<input id="nama" placeholder="Nama">
<input id="ic" placeholder="000000-00-0000">
<input id="jantina" placeholder="Jantina" readonly>
<input id="telefon" placeholder="012-3456789">
<input id="alamat" placeholder="Alamat">
<input type="file" id="gambar">

<button onclick="daftarAhli()">Daftar</button>
<button class="back" onclick="nav('menuPage')">Kembali</button>

<table id="tableAhli"></table>
</div>

<!-- SEMAK -->
<div class="container" id="semakPage" style="display:none">
<h2>Semakan Ahli</h2>
<input id="semakIC">
<button onclick="semakAhli()">Semak</button>
<button class="back" onclick="nav('menuPage')">Kembali</button>
<div id="hasilSemak"></div>
</div>

</div>

<script>
let ahliList=JSON.parse(localStorage.getItem('ahliList'))||[];
let isAdmin=false;

/* DATE */
function formatDate(d){
return d.toLocaleDateString('ms-MY');
}

/* LOGIN */
function login(){
if(user.value==="admin"&&pass.value==="1234"){
isAdmin=true;
}else{
isAdmin=false;
}

menuBtn.style.display='block';
loadMenu();
showPage('menuPage');
}

/* MENU */
function loadMenu(){
sidebar.innerHTML=`
<button onclick="nav('menuPage')">Dashboard</button>
${isAdmin?'<button onclick="nav(\'daftarPage\')">Daftar Ahli</button>':''}
<button onclick="nav('semakPage')">Semakan Ahli</button>
<button onclick="logout()">Logout</button>`;
}

function toggleMenu(){
sidebar.style.display=sidebar.style.display==='block'?'none':'block';
}

function nav(p){
showPage(p);
sidebar.style.display='none';
}

function logout(){
sidebar.style.display='none';
menuBtn.style.display='none';
showPage('loginPage');
}

/* PAGE */
function showPage(p){
document.querySelectorAll('.container').forEach(c=>c.style.display='none');
document.getElementById(p).style.display='block';
loadTable();
loadStats();
}

/* IC */
ic.addEventListener('input',()=>{
let v=ic.value.replace(/\D/g,'').slice(0,12);
if(v.length>6)v=v.slice(0,6)+'-'+v.slice(6);
if(v.length>9)v=v.slice(0,9)+'-'+v.slice(9);
ic.value=v;
jantina.value=v.length===14?(parseInt(v.slice(-1))%2===0?'Perempuan':'Lelaki'):'';
});

/* TELEFON */
telefon.addEventListener('input',()=>{
let v=telefon.value.replace(/\D/g,'').slice(0,11);
if(v.length>3)v=v.slice(0,3)+'-'+v.slice(3);
telefon.value=v;
});

/* STATUS */
function getStatus(l){
return new Date()>new Date(l)?'expired':'active';
}

/* DAFTAR */
function daftarAhli(){
if(!isAdmin)return;

if(ahliList.find(a=>a.ic===ic.value)){
alert("IC sudah wujud");return;
}

let today=new Date();
let exp=new Date();
exp.setFullYear(exp.getFullYear()+1);

let reader=new FileReader();
reader.onload=function(){

ahliList.push({
nama:nama.value,
ic:ic.value,
jantina:jantina.value,
telefon:telefon.value,
alamat:alamat.value,
gambar:reader.result||'',
daftar:formatDate(today),
luput:formatDate(exp)
});

localStorage.setItem('ahliList',JSON.stringify(ahliList));
loadTable();
};

if(gambar.files[0])reader.readAsDataURL(gambar.files[0]);
else reader.onload();
}

/* TABLE */
function loadTable(){
if(!isAdmin)return;

tableAhli.innerHTML=`<tr>
<th>Gambar</th><th>Nama</th><th>IC</th><th>Jantina</th>
<th>Telefon</th><th>Alamat</th>
<th>Daftar</th><th>Luput</th><th>Status</th><th>Aksi</th>
</tr>`;

ahliList.forEach((a,i)=>{
let s=getStatus(a.luput);

tableAhli.innerHTML+=`
<tr>
<td><img src="${a.gambar||''}" class="avatar"></td>
<td>${a.nama}</td>
<td>${a.ic}</td>
<td>${a.jantina}</td>
<td>${a.telefon}</td>
<td>${a.alamat}</td>
<td>${a.daftar}</td>
<td>${a.luput}</td>
<td>${s==='active'
?'<span class="status-active">AKTIF</span>'
:'<span class="status-expired">LUPUT</span>'}</td>
<td>
${isAdmin?`
<button onclick="deleteAhli(${i})">Delete</button>`:''}
</td>
</tr>`;
});
}

/* DELETE */
function deleteAhli(i){
if(confirm("Padam ahli?")){
ahliList.splice(i,1);
localStorage.setItem('ahliList',JSON.stringify(ahliList));
loadTable();
}
}

/* SEMAK */
function semakAhli(){
let r=ahliList.find(a=>a.ic===semakIC.value);

if(!r){hasilSemak.innerHTML="Tiada rekod";return;}

let s=getStatus(r.luput);

hasilSemak.innerHTML=`
<div class="container">
<img src="${r.gambar||''}" class="avatar">
<h3>${r.nama}</h3>
<p>IC: ${r.ic}</p>
<p>Telefon: ${r.telefon}</p>
<p>Alamat: ${r.alamat}</p>
<p>Jantina: ${r.jantina}</p>
<p>Tarikh Daftar: ${r.daftar}</p>
<p>Tarikh Luput: ${r.luput}</p>
<p class="${s==='active'?'status-active':'status-expired'}">
${s==='active'?'AKTIF':'LUPUT'}
</p>
</div>`;
}

/* STATS */
function loadStats(){
let total=ahliList.length;
let aktif=ahliList.filter(a=>getStatus(a.luput)==='active').length;
let luput=total-aktif;

stats.innerHTML=`
<div class="stat blue">Jumlah<br>${total}</div>
<div class="stat green">Aktif<br>${aktif}</div>
<div class="stat red">Luput<br>${luput}</div>
`;
}

/* CLOCK */
setInterval(()=>{
clock.innerText=new Date().toLocaleTimeString('ms-MY');
date.innerText=new Date().toLocaleDateString('ms-MY',{weekday:'long'});
},1000);
</script>

</body>
</html>
