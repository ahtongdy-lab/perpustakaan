<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sistem Perpustakaan</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>
*{box-sizing:border-box}
body{
margin:0;font-family:'Poppins',sans-serif;
background:linear-gradient(rgba(0,0,50,0.6),rgba(0,0,80,0.7)),
url('https://images.unsplash.com/photo-1524995997946-a1c2e315a42f') center/cover no-repeat;
}

/* HEADER */
.header{
position:fixed;top:0;width:100%;
background:rgba(0,0,0,0.6);
color:white;padding:10px;
display:flex;align-items:center;gap:10px;
z-index:1000;
}

/* MENU BUTTON */
.menu-toggle{
display:none;
position:fixed;
top:65px;left:10px;
background:#003366;color:white;
padding:10px 14px;border-radius:10px;
z-index:1005;
}

/* SIDEBAR */
.sidebar{
width:250px;
background:rgba(0,0,0,0.85);
position:fixed;
top:60px;
left:0;
height:100%;
padding:10px;
transition:0.3s;
z-index:1006;
}
.sidebar button{
width:100%;
margin:5px 0;
padding:12px;
border:none;
border-radius:10px;
background:rgba(255,255,255,0.1);
color:white;
cursor:pointer;
}

/* OVERLAY */
.overlay{
display:none;
position:fixed;
top:0;left:0;
width:100%;height:100%;
background:rgba(0,0,0,0.5);
z-index:1002;
}

/* MAIN */
.main{
margin-left:250px;
margin-top:70px;
padding:20px;
}

/* CONTAINER */
.container{
max-width:1000px;
margin:auto;
background:rgba(255,255,255,0.15);
padding:20px;
border-radius:20px;
color:white;
text-align:center;
}

/* INPUT */
input{
width:100%;
padding:10px;
margin:5px 0;
border-radius:10px;
border:none;
}

/* BUTTON */
.main-btn{
width:100%;
padding:10px;
margin-top:10px;
border:none;
border-radius:10px;
background:#003366;
color:white;
}

/* TABLE */
table{
width:100%;
margin-top:15px;
border-collapse:collapse;
}
th,td{
padding:10px;
border-bottom:1px solid rgba(255,255,255,0.2);
text-align:center;
}

/* GAMBAR */
.img-ahli{
width:50px;height:50px;
border-radius:50%;
object-fit:cover;
}

/* STATUS */
.status-active{color:#00ff88;font-weight:bold}
.status-expired{color:#ff4d4d;font-weight:bold}

/* DASHBOARD */
#clock{font-size:32px;font-weight:bold}
#dateBox{font-size:18px}

.stats{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
gap:15px;
margin-top:15px;
}
.stat-card{
padding:20px;border-radius:15px;font-weight:bold;color:white;
}
.blue{background:#0066cc}
.green{background:#00aa66}
.red{background:#cc0033}

/* MOBILE */
@media(max-width:768px){
.menu-toggle{display:block}

.sidebar{
left:-260px;
}
.sidebar.active{
left:0;
}

.main{
margin-left:0;
}

table{
display:block;
overflow-x:auto;
}
}
</style>
</head>

<body>

<div class="header">
<div>📚 Perpustakaan Awam Majlis Daerah Simunjan</div>
</div>

<div class="menu-toggle" onclick="openMenu()">☰</div>
<div class="overlay" id="overlay" onclick="closeMenu()"></div>

<div class="sidebar" id="sidebar">
<button onclick="navigate('menuPage')">Dashboard</button>
<button onclick="navigate('daftarPage')">Daftar Ahli</button>
<button onclick="navigate('semakPage')">Semakan Ahli</button>
<button onclick="logout()">Log Keluar</button>
</div>

<div class="main">

<!-- LOGIN -->
<div class="container" id="loginPage">
<h2>Log Masuk Sistem</h2>
<input id="user">
<input id="pass" type="password">
<button class="main-btn" onclick="login()">Log Masuk</button>
</div>

<!-- DASHBOARD -->
<div class="container" id="menuPage" style="display:none">
<h3>Selamat Datang</h3>
<div id="clock"></div>
<div id="dateBox"></div>
<div class="stats" id="stats"></div>
</div>

<!-- DAFTAR -->
<div class="container" id="daftarPage" style="display:none">
<h2>Daftar Ahli</h2>

<input id="nama" placeholder="Nama">
<input id="ic" placeholder="000000-00-0000">
<input id="jantina" readonly placeholder="Jantina">
<input id="telefon" placeholder="012-3456789">
<input id="alamat" placeholder="Alamat">
<input type="file" id="gambar">

<button class="main-btn" onclick="daftarAhli()">Daftar</button>

<table id="tableAhli"></table>
</div>

<!-- SEMAK -->
<div class="container" id="semakPage" style="display:none">
<h2>Semakan Ahli</h2>
<input id="semakIC" placeholder="Masukkan No IC">
<button class="main-btn" onclick="semakAhli()">Semak</button>
<table id="tableSemak"></table>
</div>

</div>

<script>
let ahliList = JSON.parse(localStorage.getItem('ahliList')) || [];

/* MENU */
function openMenu(){sidebar.classList.add('active');overlay.style.display='block'}
function closeMenu(){sidebar.classList.remove('active');overlay.style.display='none'}
function navigate(page){showPage(page);closeMenu()}

/* LOGIN */
function login(){sidebar.style.display='block';showPage('menuPage')}
function logout(){sidebar.style.display='none';showPage('loginPage')}

/* PAGE */
function showPage(page){
document.querySelectorAll('.container').forEach(p=>p.style.display='none');
document.getElementById(page).style.display='block';
if(page==='daftarPage')loadTable();
if(page==='menuPage')loadStats();
}

/* IC */
ic.addEventListener('input', function(){
let raw=this.value.replace(/\D/g,'').substring(0,12);
let val=raw;
if(raw.length>6) val=raw.slice(0,6)+'-'+raw.slice(6);
if(raw.length>9) val=val.slice(0,9)+'-'+val.slice(9);
this.value=val;

jantina.value = raw.length===12 ? (raw.slice(-1)%2===0?'Perempuan':'Lelaki') : '';
});

/* TELEFON */
telefon.addEventListener('input', function(){
let raw=this.value.replace(/\D/g,'').substring(0,11);
if(raw.length>3) raw=raw.slice(0,3)+'-'+raw.slice(3);
this.value=raw;
});

/* DATE */
function formatDate(d){
return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,'0')+"-"+String(d.getDate()).padStart(2,'0');
}

/* DAFTAR */
function daftarAhli(){
let reader=new FileReader();
let file=gambar.files[0];

if(file){
reader.onload=()=>saveAhli(reader.result);
reader.readAsDataURL(file);
}else saveAhli("");
}

function saveAhli(img){
let today=new Date();
let exp=new Date();exp.setFullYear(exp.getFullYear()+1);

ahliList.push({
nama:nama.value,
ic:ic.value,
jantina:jantina.value,
telefon:telefon.value,
alamat:alamat.value,
gambar:img,
tarikhDaftar:formatDate(today),
tarikhLuput:formatDate(exp)
});

localStorage.setItem('ahliList',JSON.stringify(ahliList));
loadTable();loadStats();
}

/* STATUS */
function getStatus(l){
return formatDate(new Date())>l?'expired':'active';
}

/* TABLE DAFTAR */
function loadTable(){
let html=`<tr>
<th>Gambar</th><th>Nama</th><th>No IC</th><th>Jantina</th>
<th>Telefon</th><th>Alamat</th>
<th>Tarikh Daftar</th><th>Tarikh Luput</th><th>Status</th>
</tr>`;

ahliList.forEach(a=>{
let s=getStatus(a.tarikhLuput);
html+=`<tr>
<td>${a.gambar?`<img src="${a.gambar}" class="img-ahli">`:"-"}</td>
<td>${a.nama}</td>
<td>${a.ic}</td>
<td>${a.jantina}</td>
<td>${a.telefon}</td>
<td>${a.alamat}</td>
<td>${a.tarikhDaftar}</td>
<td>${a.tarikhLuput}</td>
<td class="${s==='active'?'status-active':'status-expired'}">${s==='active'?'AKTIF':'LUPUT'}</td>
</tr>`;
});

tableAhli.innerHTML=html;
}

/* SEMAK */
function semakAhli(){
let r=ahliList.find(a=>a.ic===semakIC.value);
if(!r){tableSemak.innerHTML="Tiada rekod";return;}

let s=getStatus(r.tarikhLuput);

tableSemak.innerHTML=`<tr>
<th>Gambar</th><th>Nama</th><th>No IC</th><th>Jantina</th>
<th>Telefon</th><th>Alamat</th>
<th>Tarikh Daftar</th><th>Tarikh Luput</th><th>Status</th>
</tr>
<tr>
<td>${r.gambar?`<img src="${r.gambar}" class="img-ahli">`:"-"}</td>
<td>${r.nama}</td>
<td>${r.ic}</td>
<td>${r.jantina}</td>
<td>${r.telefon}</td>
<td>${r.alamat}</td>
<td>${r.tarikhDaftar}</td>
<td>${r.tarikhLuput}</td>
<td class="${s==='active'?'status-active':'status-expired'}">${s==='active'?'AKTIF':'LUPUT'}</td>
</tr>`;
}

/* DASHBOARD */
function loadStats(){
let total=ahliList.length;
let aktif=ahliList.filter(a=>getStatus(a.tarikhLuput)==='active').length;
let luput=total-aktif;

stats.innerHTML=`
<div class="stat-card blue">Jumlah Ahli<br>${total}</div>
<div class="stat-card green">Aktif<br>${aktif}</div>
<div class="stat-card red">Luput<br>${luput}</div>
`;
}

/* CLOCK */
setInterval(()=>{
let n=new Date();
clock.innerText=n.toLocaleTimeString();
dateBox.innerText=n.toLocaleDateString('ms-MY',{
weekday:'long',day:'numeric',month:'long',year:'numeric'
});
},1000);
</script>

</body>
</html>
